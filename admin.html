<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a33"><title>Master Pro Lig | Yönetici Paneli</title><style>body{margin:0;background:#f4f6f8;color:#142235;font-family:Inter,system-ui,Arial}.top{background:#071a33;color:#fff}.nav{max-width:1100px;margin:auto;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e4e8ee;border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 10px 30px #071a3312}.login{max-width:430px;margin:70px auto}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:#e5aa49;color:#071a33}.secondary{background:#eef2f7;color:#071a33}.danger{background:#ffe8e8;color:#a52626}.hidden{display:none!important}.muted{color:#718096}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;border:1px solid #e4e8ee;border-radius:16px;padding:16px}.stat b{display:block;font-size:28px;margin-top:5px}input,select{width:100%;padding:11px;border:1px solid #d6dde6;border-radius:9px;font:inherit;box-sizing:border-box}label{display:block;font-size:12px;font-weight:800;color:#718096;margin:8px 0 4px}.list{display:grid;gap:8px}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid #e4e8ee;border-radius:12px;padding:12px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.item{align-items:flex-start;flex-direction:column}}</style></head><body><header class="top"><div class="nav"><b>⚽ MASTER PRO LİG<br><small>Yönetici Paneli</small></b><button class="btn secondary" onclick="location.href='index.html'">Siteye Dön</button></div></header><main class="wrap"><section id="login" class="card login"><h2>🔐 Yönetici Girişi</h2><p class="muted">Yönetici paneline erişmek için şifrenizi girin.</p><label for="pw">Şifre</label><input id="pw" type="password" autocomplete="current-password" placeholder="Yönetici şifresi"><br><br><button id="loginBtn" class="btn primary" type="button">Giriş Yap</button><p id="err" style="color:#b83232"></p></section><section id="app" class="hidden"><div class="stats"><div class="stat">Takım<b id="sTeams">0</b></div><div class="stat">Oyuncu<b id="sPlayers">0</b></div><div class="stat">Maç<b id="sMatches">0</b></div><div class="stat">Turnuva<b id="sTours">0</b></div></div><div class="tabs"><button class="btn primary" onclick="show('dashboard')">Özet</button><button class="btn secondary" onclick="show('tournaments')">Turnuvalar</button><button class="btn secondary" onclick="show('teams')">Takımlar</button><button class="btn secondary" onclick="show('players')">Oyuncular</button><button class="btn secondary" onclick="show('matches')">Maçlar / Skor</button><button class="btn secondary" onclick="backup()">Yedek Al</button><button class="btn secondary" onclick="restore()">Yedek Yükle</button></div><div id="content"></div></section></main><script>
const KEY='mplData';const PASSWORD='a475rh45';const seed={tournaments:[{id:'mpl-2026',name:'Master Pro Lig 2026'}],teams:[{id:'s1453',name:'Sultanbeyli 1453 Masterlar',city:'İstanbul',logo:'MPL',players:[]},{id:'legends',name:'Legends FC',city:'İstanbul',logo:'LF',players:[]},{id:'anadolu',name:'Anadolu Veteran',city:'İstanbul',logo:'AV',players:[]},{id:'pendik',name:'Pendik Güzelyalı',city:'İstanbul',logo:'PG',players:[]},{id:'velibaba',name:'Velibaba Master',city:'İstanbul',logo:'VM',players:[]},{id:'unoser',name:'Unoser Masterlar',city:'İstanbul',logo:'UM',players:[]}],fixtures:[]};let data=JSON.parse(localStorage.getItem(KEY)||'null')||seed;const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const T=id=>data.teams.find(t=>t.id===id);const TR=id=>data.tournaments.find(t=>t.id===id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function doLogin(){const value=document.getElementById('pw').value.trim();if(value===PASSWORD){localStorage.setItem('mplAdmin','1');document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('err').textContent='';show('dashboard')}else document.getElementById('err').textContent='Şifre hatalı.'}
document.getElementById('loginBtn').addEventListener('click',doLogin);document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
function show(tab){sTeams.textContent=data.teams.length;sPlayers.textContent=data.teams.reduce((n,t)=>n+(t.players?.length||0),0);sMatches.textContent=data.fixtures.length;sTours.textContent=data.tournaments.length;let h='';if(tab==='dashboard')h='<div class="card"><h2>📊 Yönetim Özeti</h2><p class="muted">Turnuva, takım, oyuncu ve maç verilerini buradan yönetebilirsin.</p></div>';if(tab==='tournaments')h=tours();if(tab==='teams')h=teams();if(tab==='players')h=players();if(tab==='matches')h=matches();document.getElementById('content').innerHTML=h}
function tours(){return `<div class="card"><h2>🏆 Turnuvalar</h2><button class="btn primary" onclick="addTour()">+ Turnuva Ekle</button><div class="list">${data.tournaments.map(t=>`<div class="item"><b>${esc(t.name)}</b><div class="actions"><button class="btn secondary" onclick="renameTour('${t.id}')">Düzenle</button><button class="btn danger" onclick="delTour('${t.id}')">Sil</button></div></div>`).join('')}</div></div>`}function addTour(){let n=prompt('Turnuva adı:');if(n){data.tournaments.push({id:'t'+Date.now(),name:n});save();show('tournaments')}}function renameTour(id){let n=prompt('Yeni ad:',TR(id).name);if(n){TR(id).name=n;save();show('tournaments')}}function delTour(id){if(data.tournaments.length<2)return alert('En az bir turnuva kalmalı.');if(confirm('Turnuva ve maçları silinsin mi?')){data.tournaments=data.tournaments.filter(t=>t.id!==id);data.fixtures=data.fixtures.filter(f=>f.t!==id);save();show('tournaments')}}function teams(){return `<div class="card"><h2>🛡️ Takımlar</h2><button class="btn primary" onclick="addTeam()">+ Takım Ekle</button><div class="list">${data.teams.map(t=>`<div class="item"><div><b>${esc(t.name)}</b><div class="muted">${esc(t.city||'')} • ${t.players?.length||0} oyuncu</div></div><div class="actions"><button class="btn secondary" onclick="editTeam('${t.id}')">Düzenle</button><button class="btn danger" onclick="delTeam('${t.id}')">Sil</button></div></div>`).join('')}</div></div>`}function addTeam(){let n=prompt('Takım adı:');if(n){data.teams.push({id:'tm'+Date.now(),name:n,city:'',logo:n.slice(0,2).toUpperCase(),players:[]});save();show('teams')}}function editTeam(id){let t=T(id),n=prompt('Takım adı:',t.name);if(n){t.name=n;save();show('teams')}}function delTeam(id){if(data.fixtures.some(f=>f.home===id||f.away===id))return alert('Bu takımın maçı var. Önce maçlarını sil.');if(confirm('Silinsin mi?')){data.teams=data.teams.filter(t=>t.id!==id);save();show('teams')}}function players(){return `<div class="card"><h2>👤 Oyuncular</h2><button class="btn primary" onclick="addPlayer()">+ Oyuncu Ekle</button><div class="list">${data.teams.flatMap(t=>(t.players||[]).map((p,i)=>`<div class="item"><div><b>${esc(p.name)}</b><div class="muted">${esc(t.name)} • ${esc(p.pos)} • #${esc(p.no)}</div></div><button class="btn danger" onclick="delPlayer('${t.id}',${i})">Sil</button></div>`)).join('')}</div></div>`}function addPlayer(){let opts=data.teams.map((t,i)=>i+': '+t.name).join('\n'),idx=prompt('Takım numarası:\n'+opts),t=data.teams[Number(idx)];if(!t)return;let n=prompt('Oyuncu adı:');if(!n)return;t.players.push({name:n,pos:prompt('Mevki:','')||'',no:prompt('Forma no:','')||''});save();show('players')}function delPlayer(t,i){if(confirm('Oyuncu silinsin mi?')){T(t).players.splice(i,1);save();show('players')}}function matches(){return `<div class="card"><h2>⚽ Maçlar / Skor Girişi</h2><button class="btn primary" onclick="addMatch()">+ Maç Ekle</button><div class="list">${data.fixtures.map(f=>`<div class="item"><div><b>${esc(T(f.home)?.name)} — ${esc(T(f.away)?.name)}</b><div class="muted">${esc(f.date)} • ${esc(f.time)} • ${f.hs!=null&&f.as!=null?'<b>'+f.hs+' - '+f.as+'</b>':'Oynanmadı'}</div></div><div class="actions"><button class="btn primary" onclick="score('${f.id}')">Skor</button><button class="btn danger" onclick="delMatch('${f.id}')">Sil</button></div></div>`).join('')}</div></div>`}function addMatch(){if(data.teams.length<2)return;let d=prompt('Tarih (YYYY-AA-GG):');if(!d)return;let ti=prompt('Saat:','21:00'),opts=data.teams.map((t,i)=>i+': '+t.name).join('\n'),h=prompt('Ev sahibi takım numarası:\n'+opts),a=prompt('Deplasman takım numarası:\n'+opts),home=data.teams[Number(h)],away=data.teams[Number(a)];if(!home||!away||home.id===away.id)return alert('Takım seçimi hatalı.');data.fixtures.push({id:'f'+Date.now(),t:data.tournaments[0].id,date:d,time:ti||'21:00',home:home.id,away:away.id,hs:null,as:null});save();show('matches')}function score(id){let f=data.fixtures.find(x=>x.id===id),a=prompt(T(f.home).name+' skoru:',f.hs??''),b=prompt(T(f.away).name+' skoru:',f.as??'');if(a===''||b===''){f.hs=null;f.as=null}else if(!isNaN(+a)&&!isNaN(+b)){f.hs=+a;f.as=+b}else return alert('Skor geçersiz.');save();show('matches')}function delMatch(id){if(confirm('Maç silinsin mi?')){data.fixtures=data.fixtures.filter(f=>f.id!==id);save();show('matches')}}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='master-pro-lig-yedek.json';a.click()}function restore(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.teams||!x.fixtures||!x.tournaments)throw 0;data=x;save();show('dashboard');alert('Yedek yüklendi.')}catch(e){alert('Geçersiz dosya')}};r.readAsText(i.files[0])};i.click()}
(function init(){document.getElementById('login').classList.remove('hidden');document.getElementById('app').classList.add('hidden');document.getElementById('pw').value='';})();
</script></body></html>
