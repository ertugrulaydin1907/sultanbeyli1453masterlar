<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071a33"><title>Master Pro Lig | Yönetici</title><style>body{margin:0;background:#f4f6f8;color:#142235;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:18px;margin:15px 0;box-shadow:0 8px 24px #0001}.login{max-width:420px;margin:10vh auto}input,select,button,textarea{font:inherit;padding:11px;border-radius:9px;border:1px solid #ccd5df;box-sizing:border-box}input,select,textarea{width:100%}button{cursor:pointer;font-weight:800;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.primary{background:#e5aa49;color:#071a33;border:0}.danger{background:#fee4e2;color:#a52222;border:0}.secondary{background:#eef2f7;color:#071a33;border:0}.hidden{display:none!important}.field{display:grid;gap:6px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.tabs{display:flex;gap:7px;overflow:auto}.tabs button{white-space:nowrap}.active{background:#071a33;color:#fff}.msg{padding:10px;border-radius:9px;margin-top:10px}.err{background:#fef3f2;color:#b42318}.ok{background:#ecfdf3;color:#067647}.status{display:inline-block;padding:6px 10px;border-radius:20px;background:#eee}.player-cell{display:flex;align-items:center;gap:9px;min-width:220px}.player-thumb{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid #e5aa49;background:#eef2f7;display:block}.photo-btn{border:0;background:transparent;padding:0;border-radius:50%;cursor:pointer;touch-action:manipulation;position:relative}.photo-btn:active{transform:scale(.94)}.photo-btn:after{content:'📷';position:absolute;right:-3px;bottom:-3px;background:#071a33;color:#fff;border-radius:50%;width:23px;height:23px;display:grid;place-items:center;font-size:12px;border:2px solid #fff}.photo-preview{width:110px;height:110px;border-radius:16px;object-fit:cover;border:3px solid #e5aa49;background:#eef2f7;display:none;margin-top:10px}.photo-picker{border:2px dashed #e5aa49;background:#fff8eb;border-radius:14px;padding:15px;text-align:center;min-height:62px;display:grid;place-items:center;cursor:pointer;touch-action:manipulation}.photo-picker:active{transform:scale(.99);background:#fff0d2}.photo-picker strong{display:block;color:#071a33}.photo-picker span{display:block;font-size:12px;color:#6d7c8e;margin-top:4px}.photo-picker input{position:absolute!important;width:1px!important;height:1px!important;opacity:0!important;pointer-events:none!important}.selected-file{font-size:13px;font-weight:800;color:#067647;margin-top:7px;word-break:break-word}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left;vertical-align:middle}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:15px;z-index:50}.box{background:#fff;padding:20px;border-radius:18px;width:min(650px,100%);max-height:90vh;overflow:auto}.close{margin-bottom:10px}@media(max-width:600px){.wrap{padding:12px}.box{padding:16px}.tabs button{padding:10px 13px}.player-cell{min-width:190px}.player-thumb{width:48px;height:48px}}
</style></head><body><header style="background:#071a33;color:white;padding:16px"><div class="wrap" style="padding:0"><b>MASTER PRO LİG — YÖNETİCİ PANELİ</b></div></header><main class="wrap"><section id="loginBox" class="card login"><h2>🔐 Yönetici Girişi</h2><div class="field"><label>Şifre</label><input id="passwordInput" type="password" autocomplete="current-password"></div><button id="loginButton" class="primary" type="button">Panele Gir</button><div id="loginMessage"></div></section><section id="panel" class="hidden"><div class="card"><h2>Yönetim Merkezi</h2><span id="dbStatus" class="status">Bağlanıyor...</span><div id="message"></div></div><div class="tabs"><button class="active" data-tab="dash">📊 Özet</button><button data-tab="teams">🛡️ Takımlar</button><button data-tab="players">👤 Oyuncular</button><button data-tab="matches">📅 Maçlar</button><button data-tab="news">📰 Haberler</button></div><section id="dash" class="card"><div class="grid"><div><b>Takım</b><h2 id="ct">0</h2></div><div><b>Oyuncu</b><h2 id="cp">0</h2></div><div><b>Maç</b><h2 id="cm">0</h2></div><div><b>Haber</b><h2 id="cn">0</h2></div></div></section><section id="teams" class="card hidden"><h3>Takımlar</h3><button class="primary" onclick="openTeam()">+ Takım</button><div style="overflow:auto"><table><tbody id="teamRows"></tbody></table></div></section><section id="players" class="card hidden"><h3>Oyuncular</h3><button class="primary" onclick="openPlayer()">+ Oyuncu</button><div style="overflow:auto"><table><tbody id="playerRows"></tbody></table></div></section><section id="matches" class="card hidden"><h3>Maçlar</h3><button class="primary" onclick="openMatch()">+ Maç</button><div style="overflow:auto"><table><tbody id="matchRows"></tbody></table></div></section><section id="news" class="card hidden"><h3>Haberler</h3><button class="primary" onclick="openNews()">+ Haber</button><div style="overflow:auto"><table><tbody id="newsRows"></tbody></table></div></section></section></main><div id="modal" class="modal hidden"><div class="box"><button class="close secondary" onclick="closeModal()">Kapat ✕</button><div id="mc"></div></div></div><input id="quickPhotoInput" type="file" accept="image/*" style="position:fixed;left:-9999px;width:1px;height:1px;opacity:0"><script>const PASSWORD='a475rh45',URL='https://lcyjvtisriaqvudjikcw.supabase.co',KEY='sb_publishable_yp3tUVCVZwbFfN16Kj7vjw_cC2vP_lJ';let db={teams:[],players:[],matches:[],news:[],tournaments:[]},quickPlayerId=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function doLogin(){if($('passwordInput').value.trim()!==PASSWORD){$('loginMessage').innerHTML='<div class="msg err">Şifre hatalı.</div>';return}sessionStorage.setItem('mplAdmin','1');$('loginBox').classList.add('hidden');$('panel').classList.remove('hidden');await connect()}$('loginButton').addEventListener('click',doLogin);$('passwordInput').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});async function get(t){let r=await fetch(URL+'/rest/v1/'+t,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw Error(await r.text());return r.json()}async function connect(){try{[db.teams,db.players,db.matches,db.news,db.tournaments]=await Promise.all([get('teams?select=*&order=name'),get('players?select=*&order=name'),get('matches?select=*&order=match_date'),get('news?select=*&order=created_at.desc'),get('tournaments?select=*&order=created_at')]);$('dbStatus').textContent='Supabase bağlı';$('dbStatus').className='status ok';render()}catch(e){$('dbStatus').textContent='Bağlantı hatası';$('dbStatus').className='status err';$('message').innerHTML='<div class="msg err">'+esc(e.message)+'</div>'}}function teamName(id){return db.teams.find(t=>t.id===id)?.name||'-'}function render(){$('ct').textContent=db.teams.length;$('cp').textContent=db.players.length;$('cm').textContent=db.matches.length;$('cn').textContent=db.news.length;$('teamRows').innerHTML=db.teams.map(t=>'<tr><td><b>'+esc(t.name)+'</b></td><td>'+esc(t.city||'')+'</td><td><button class="danger" onclick="del(\'teams\',\''+t.id+'\')">Sil</button></td></tr>').join('');$('playerRows').innerHTML=db.players.map(p=>'<tr><td><div class="player-cell"><button class="photo-btn" title="Fotoğrafı değiştir" onclick="changePlayerPhoto(\''+p.id+'\')">'+(p.photo_url?'<img class="player-thumb" src="'+esc(p.photo_url)+'" alt="'+esc(p.name)+'">':'<span class="player-thumb" style="display:grid;place-items:center">👤</span>')+'</button><div><b>'+esc(p.name)+'</b><div style="font-size:12px;color:#6d7c8e">Fotoğrafı değiştirmek için resme dokun</div></div></div></td><td>'+esc(teamName(p.team_id))+'</td><td>'+esc(p.position||'')+'</td><td>'+esc(p.jersey_number??'')+'</td><td><button class="danger" onclick="del(\'players\',\''+p.id+'\')">Sil</button></td></tr>').join('');$('matchRows').innerHTML=db.matches.map(m=>'<tr><td>'+esc((m.match_date||'').slice(0,16).replace('T',' '))+'</td><td>'+esc(teamName(m.home_team_id))+'</td><td>'+esc(teamName(m.away_team_id))+'</td><td>'+esc(m.home_score??'—')+' - '+esc(m.away_score??'—')+'</td><td><button class="danger" onclick="del(\'matches\',\''+m.id+'\')">Sil</button></td></tr>').join('');$('newsRows').innerHTML=db.news.map(n=>'<tr><td>'+esc(n.title)+'</td><td>'+(n.published?'Yayında':'Taslak')+'</td><td><button class="danger" onclick="del(\'news\',\''+n.id+'\')">Sil</button></td></tr>').join('')}function changePlayerPhoto(id){quickPlayerId=id;const i=$('quickPhotoInput');i.value='';i.click()}$('quickPhotoInput').addEventListener('change',async()=>{const f=$('quickPhotoInput').files?.[0];if(!f||!quickPlayerId)return;if(f.size>10*1024*1024){showMsg('Fotoğraf 10 MB altında olmalı.','err');return}try{showMsg('Fotoğraf yükleniyor...','ok');const photo_url=await compressImage(f);await updateRow('players',quickPlayerId,{photo_url});quickPlayerId=null;await connect();showMsg('Oyuncu fotoğrafı güncellendi.','ok')}catch(e){showMsg('Fotoğraf güncellenemedi: '+e.message,'err')}});function showMsg(text,type){$('message').innerHTML='<div class="msg '+type+'">'+esc(text)+'</div>'}async function del(table,id){if(!confirm('Silinsin mi?'))return;let r=await fetch(URL+'/functions/v1/admin-api',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':PASSWORD},body:JSON.stringify({table,action:'delete',id})});if(!r.ok){showMsg(await r.text(),'err');return}await connect()}async function updateRow(table,id,data){let r=await fetch(URL+'/functions/v1/admin-api',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':PASSWORD},body:JSON.stringify({table,action:'update',id,data})});if(!r.ok)throw Error(await r.text());return r.json()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{['dash','teams','players','matches','news'].forEach(x=>$(x).classList.add('hidden'));$(b.dataset.tab).classList.remove('hidden');document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});function openModal(h){$('mc').innerHTML=h;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}function openTeam(){openModal('<h2>Takım Ekle</h2><div class="field"><label>Takım adı</label><input id="tn"></div><div class="field"><label>Şehir</label><input id="tc" value="İstanbul"></div><button class="primary" onclick="addTeam()">Kaydet</button>')}async function addTeam(){await insert('teams',{name:$('tn').value,city:$('tc').value})}function openPlayer(){openModal('<h2>Oyuncu Ekle</h2><div class="field"><label>Takım</label><select id="pt">'+db.teams.map(t=>'<option value="'+t.id+'">'+esc(t.name)+'</option>').join('')+'</select></div><div class="field"><label>Ad Soyad</label><input id="pn"></div><div class="field"><label>Mevki</label><input id="pp"></div><div class="field"><label>Forma No</label><input id="pno" type="number" inputmode="numeric"></div><div class="field"><label>Oyuncu Fotoğrafı</label><label class="photo-picker" for="pimg"><div><strong>📷 Fotoğraf seçmek için buraya dokun</strong><span>Galeriden veya kameradan seçebilirsin</span></div><input id="pimg" type="file" accept="image/*" capture="environment"></label><div id="selectedFile" class="selected-file"></div><img id="pimgPreview" class="photo-preview" alt="Fotoğraf önizleme"></div><button class="primary" onclick="addPlayer()">Oyuncuyu Kaydet</button>');$('pimg').addEventListener('change',previewPlayerPhoto)}function previewPlayerPhoto(){const f=$('pimg').files?.[0],img=$('pimgPreview');$('selectedFile').textContent=f?'✓ Seçilen: '+f.name:'';if(!f){img.style.display='none';return}const r=new FileReader();r.onload=()=>{img.src=r.result;img.style.display='block'};r.readAsDataURL(f)}function compressImage(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=reject;r.onload=()=>{const img=new Image();img.onload=()=>{const max=700,s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.82))};img.onerror=reject;img.src=r.result};r.readAsDataURL(file)})}async function addPlayer(){const f=$('pimg').files?.[0];let photo_url=null;if(f){if(f.size>10*1024*1024){showMsg('Fotoğraf 10 MB altında olmalı.','err');return}try{photo_url=await compressImage(f)}catch(e){showMsg('Fotoğraf okunamadı.','err');return}}await insert('players',{team_id:$('pt').value,name:$('pn').value.trim(),position:$('pp').value.trim()||null,jersey_number:$('pno').value?Number($('pno').value):null,photo_url})}function openMatch(){openModal('<h2>Maç Ekle</h2><div class="field"><label>Ev sahibi</label><select id="mh">'+db.teams.map(t=>'<option value="'+t.id+'">'+esc(t.name)+'</option>').join('')+'</select></div><div class="field"><label>Deplasman</label><select id="ma">'+db.teams.map(t=>'<option value="'+t.id+'">'+esc(t.name)+'</option>').join('')+'</select></div><div class="field"><label>Tarih</label><input id="md" type="datetime-local"></div><button class="primary" onclick="addMatch()">Kaydet</button>')}async function addMatch(){await insert('matches',{tournament_id:db.tournaments[0]?.id||null,home_team_id:$('mh').value,away_team_id:$('ma').value,match_date:$('md').value||null,status:'scheduled'})}function openNews(){openModal('<h2>Haber Ekle</h2><div class="field"><label>Başlık</label><input id="nt"></div><div class="field"><label>İçerik</label><textarea id="nc"></textarea></div><button class="primary" onclick="addNews()">Kaydet</button>')}async function addNews(){await insert('news',{title:$('nt').value,content:$('nc').value,published:true})}async function insert(table,data){let r=await fetch(URL+'/functions/v1/admin-api',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':PASSWORD},body:JSON.stringify({table,action:'insert',data})});if(!r.ok){showMsg(await r.text(),'err');return}closeModal();await connect()}if(sessionStorage.getItem('mplAdmin')==='1')doLogin();</script></body></html>
