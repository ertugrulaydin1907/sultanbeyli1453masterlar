<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a33"><title>Master Pro Lig | Yönetici Paneli</title><style>:root{--n:#071a33;--b:#123e69;--g:#e5aa49;--bg:#f4f6f8;--t:#142235;--m:#718096;--l:#e4e8ee;--r:#b83232}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,Segoe UI,Arial}.top{background:linear-gradient(120deg,#06172c,#123c68);color:#fff}.nav{max-width:1200px;margin:auto;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900}.wrap{max-width:1200px;margin:auto;padding:22px 20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:var(--g);color:var(--n)}.secondary{background:#eef2f7;color:var(--n)}.danger{background:#ffe8e8;color:#a52626}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 10px 30px #071a3312}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;border:1px solid var(--l);border-radius:16px;padding:16px}.stat b{display:block;font-size:28px;margin-top:5px}input,select{width:100%;padding:11px;border:1px solid #d6dde6;border-radius:9px;font:inherit}label{display:block;font-size:12px;font-weight:800;color:var(--m);margin:8px 0 4px}.list{display:grid;gap:8px}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--l);border-radius:12px;padding:12px}.actions{display:flex;gap:6px;flex-wrap:wrap}.hidden{display:none}.login{max-width:430px;margin:70px auto}.muted{color:var(--m)}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid var(--l);text-align:left}@media(max-width:700px){.grid,.stats{grid-template-columns:1fr}.item{align-items:flex-start;flex-direction:column}}</style></head><body><header class="top"><div class="nav"><div class="brand">⚽ MASTER PRO LİG<br><small>Yönetici Paneli</small></div><button class="btn secondary" onclick="location.href='index.html'">Siteye Dön</button></div></header><main class="wrap"><section id="login" class="card login"><h2>🔐 Yönetici Girişi</h2><p class="muted">Bu ilk sürüm ücretsiz ve istemci taraflıdır.</p><label>Şifre</label><input id="pw" type="password" placeholder="Yönetici şifresi"><br><br><button class="btn primary" onclick="login()">Giriş Yap</button><p id="err" style="color:#b83232"></p></section><section id="app" class="hidden"><div class="stats"><div class="stat">Takım<b id="sTeams">0</b></div><div class="stat">Oyuncu<b id="sPlayers">0</b></div><div class="stat">Maç<b id="sMatches">0</b></div><div class="stat">Turnuva<b id="sTours">0</b></div></div><div class="tabs"><button class="btn primary" onclick="show('dashboard')">Özet</button><button class="btn secondary" onclick="show('tournaments')">Turnuvalar</button><button class="btn secondary" onclick="show('teams')">Takımlar</button><button class="btn secondary" onclick="show('players')">Oyuncular</button><button class="btn secondary" onclick="show('matches')">Maçlar / Skor</button><button class="btn secondary" onclick="backup()">Yedek Al</button><button class="btn secondary" onclick="restore()">Yedek Yükle</button></div><div id="content"></div></section></main><script>
const KEY='mplData';const PASSWORD='a475rh45';const seed={tournaments:[{id:'mpl-2026',name:'Master Pro Lig 2026'}],teams:[{id:'s1453',name:'Sultanbeyli 1453 Masterlar',city:'İstanbul',logo:'MPL',players:[['Emin','Kaleci',55],['Muhammed Dizman','Sol Bek',53],['Serdar Kocabal','Sol Stoper',99],['Savaş Yılmaz','Sağ Stoper',67],['Yalçın Beyaz','Sağ Bek',4],['Gökhan Türk','Ön Libero',6],['Eyüp','Ön Libero',15],['Güngör','Orta Saha',8],['Sacit Savaş','Sağ Açık',20],['Mehmet','Sol Açık',88],['Muhammed Tekin','Forvet',29]].map(x=>({name:x[0],pos:x[1],no:x[2]}))},{id:'legends',name:'Legends FC',city:'İstanbul',logo:'LF',players:[]},{id:'anadolu',name:'Anadolu Veteran',city:'İstanbul',logo:'AV',players:[]},{id:'pendik',name:'Pendik Güzelyalı',city:'İstanbul',logo:'PG',players:[]},{id:'velibaba',name:'Velibaba Master',city:'İstanbul',logo:'VM',players:[]},{id:'unoser',name:'Unoser Masterlar',city:'İstanbul',logo:'UM',players:[]}],fixtures:[{id:'f1',t:'mpl-2026',date:'2026-08-18',time:'21:00',home:'s1453',away:'legends',hs:null,as:null},{id:'f2',t:'mpl-2026',date:'2026-08-20',time:'21:30',home:'anadolu',away:'pendik',hs:null,as:null},{id:'f3',t:'mpl-2026',date:'2026-08-22',time:'22:00',home:'velibaba',away:'unoser',hs:null,as:null}]};let data=JSON.parse(localStorage.getItem(KEY)||'null')||seed;const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const T=id=>data.teams.find(t=>t.id===id);const TR=id=>data.tournaments.find(t=>t.id===id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function login(){if(pw.value===PASSWORD){localStorage.setItem('mplAdmin','1');loginBox(false);show('dashboard')}else err.textContent='Şifre hatalı.'}function loginBox(x){login.classList.toggle('hidden',!x);app.classList.toggle('hidden',x)}function show(tab){sTeams.textContent=data.teams.length;sPlayers.textContent=data.teams.reduce((n,t)=>n+(t.players?.length||0),0);sMatches.textContent=data.fixtures.length;sTours.textContent=data.tournaments.length;let h='';if(tab==='dashboard')h='<div class="card"><h2>📊 Yönetim Özeti</h2><p class="muted">Buradan turnuva, takım, oyuncu ve maç verilerini yönetebilirsin.</p><p><b>Önemli:</b> Bu sürüm ücretsiz istemci taraflıdır. Ortak veritabanı için sonraki aşamada ücretsiz bir backend bağlayacağız.</p></div>';if(tab==='tournaments')h=tours();if(tab==='teams')h=teams();if(tab==='players')h=players();if(tab==='matches')h=matches();content.innerHTML=h}function tours(){return `<div class="card"><h2>🏆 Turnuvalar</h2><div class="actions"><button class="btn primary" onclick="addTour()">+ Turnuva Ekle</button></div><div class="list">${data.tournaments.map(t=>`<div class="item"><b>${esc(t.name)}</b><div class="actions"><button class="btn secondary" onclick="renameTour('${t.id}')">Düzenle</button><button class="btn danger" onclick="delTour('${t.id}')">Sil</button></div></div>`).join('')}</div></div>`}function addTour(){let n=prompt('Turnuva adı:');if(!n)return;data.tournaments.push({id:'t'+Date.now(),name:n});save();show('tournaments')}function renameTour(id){let n=prompt('Yeni ad:',TR(id).name);if(n){TR(id).name=n;save();show('tournaments')}}function delTour(id){if(data.tournaments.length<2)return alert('En az bir turnuva kalmalı.');if(confirm('Turnuva ve maçları silinsin mi?')){data.tournaments=data.tournaments.filter(t=>t.id!==id);data.fixtures=data.fixtures.filter(f=>f.t!==id);save();show('tournaments')}}function teams(){return `<div class="card"><h2>🛡️ Takımlar</h2><div class="actions"><button class="btn primary" onclick="addTeam()">+ Takım Ekle</button></div><div class="list">${data.teams.map(t=>`<div class="item"><div><b>${esc(t.name)}</b><div class="muted">${esc(t.city||'')} • ${t.players?.length||0} oyuncu</div></div><div class="actions"><button class="btn secondary" onclick="editTeam('${t.id}')">Düzenle</button><button class="btn danger" onclick="delTeam('${t.id}')">Sil</button></div></div>`).join('')}</div></div>`}function addTeam(){let n=prompt('Takım adı:');if(!n)return;data.teams.push({id:'tm'+Date.now(),name:n,city:'',logo:n.slice(0,2).toUpperCase(),players:[]});save();show('teams')}function editTeam(id){let t=T(id),n=prompt('Takım adı:',t.name);if(n){t.name=n;save();show('teams')}}function delTeam(id){if(data.fixtures.some(f=>f.home===id||f.away===id))return alert('Bu takımın maçı var. Önce maçlarını sil.');if(confirm('Silinsin mi?')){data.teams=data.teams.filter(t=>t.id!==id);save();show('teams')}}function players(){return `<div class="card"><h2>👤 Oyuncular</h2><div class="actions"><button class="btn primary" onclick="addPlayer()">+ Oyuncu Ekle</button></div><div class="list">${data.teams.flatMap(t=>(t.players||[]).map((p,i)=>`<div class="item"><div><b>${esc(p.name)}</b><div class="muted">${esc(t.name)} • ${esc(p.pos)} • #${esc(p.no)}</div></div><div class="actions"><button class="btn danger" onclick="delPlayer('${t.id}',${i})">Sil</button></div></div>`)).join('')}</div></div>`}function addPlayer(){if(!data.teams.length)return;let opts=data.teams.map((t,i)=>i+': '+t.name).join('\n');let idx=prompt('Takım numarası:\n'+opts);let t=data.teams[Number(idx)];if(!t)return;let n=prompt('Oyuncu adı:');if(!n)return;let pos=prompt('Mevki:','');let no=prompt('Forma no:','');t.players.push({name:n,pos:pos||'',no:no||''});save();show('players')}function delPlayer(t,i){if(confirm('Oyuncu silinsin mi?')){T(t).players.splice(i,1);save();show('players')}}function matches(){return `<div class="card"><h2>⚽ Maçlar / Skor Girişi</h2><div class="actions"><button class="btn primary" onclick="addMatch()">+ Maç Ekle</button></div><div class="list">${data.fixtures.map(f=>`<div class="item"><div><b>${esc(T(f.home)?.name)} — ${esc(T(f.away)?.name)}</b><div class="muted">${esc(f.date)} • ${esc(f.time)} • ${f.hs!=null&&f.as!=null?'<b>'+f.hs+' - '+f.as+'</b>':'Oynanmadı'}</div></div><div class="actions"><button class="btn primary" onclick="score('${f.id}')">Skor</button><button class="btn danger" onclick="delMatch('${f.id}')">Sil</button></div></div>`).join('')}</div></div>`}function addMatch(){if(data.teams.length<2)return alert('En az iki takım gerekli.');let d=prompt('Tarih (YYYY-AA-GG):');if(!d)return;let ti=prompt('Saat:','21:00');let h=prompt('Ev sahibi takım numarası:\n'+data.teams.map((t,i)=>i+': '+t.name).join('\n'));let a=prompt('Deplasman takım numarası:\n'+data.teams.map((t,i)=>i+': '+t.name).join('\n'));let home=data.teams[Number(h)],away=data.teams[Number(a)];if(!home||!away||home.id===away.id)return alert('Takım seçimi hatalı.');data.fixtures.push({id:'f'+Date.now(),t:data.tournaments[0].id,date:d,time:ti||'21:00',home:home.id,away:away.id,hs:null,as:null});save();show('matches')}function score(id){let f=data.fixtures.find(x=>x.id===id),a=prompt(T(f.home).name+' skoru:',f.hs??'');let b=prompt(T(f.away).name+' skoru:',f.as??'');if(a===''||b===''){f.hs=null;f.as=null}else if(!isNaN(+a)&&!isNaN(+b)){f.hs=+a;f.as=+b}else return alert('Skor geçersiz.');save();show('matches')}function delMatch(id){if(confirm('Maç silinsin mi?')){data.fixtures=data.fixtures.filter(f=>f.id!==id);save();show('matches')}}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='master-pro-lig-yedek.json';a.click()}function restore(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.teams||!x.fixtures||!x.tournaments)throw 0;data=x;save();show('dashboard');alert('Yedek yüklendi.')}catch(e){alert('Geçersiz dosya')}};r.readAsText(i.files[0])};i.click()}if(localStorage.getItem('mplAdmin')==='1')loginBox(false);else loginBox(true);show('dashboard');</script></body></html>
