<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a33"><title>Master Pro Lig | Yönetici</title><style>:root{--n:#071a33;--g:#e5aa49;--bg:#f4f6f8;--t:#142235;--m:#6d7c8e;--l:#e1e7ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,system-ui,sans-serif}header{background:linear-gradient(120deg,#06172c,#123e69);color:#fff;padding:14px 20px}.bar,main{max-width:1200px;margin:auto}.bar{display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{display:flex;align-items:center;gap:12px;font-weight:900}.logo{width:54px;height:54px;border-radius:50%;border:2px solid var(--g)}.small,.muted{font-size:12px;color:#b9c8da}main{padding:22px 20px}.card{background:#fff;border:1px solid var(--l);border-radius:20px;padding:20px;margin:18px 0;box-shadow:0 10px 30px #071a3312}.login{max-width:430px;margin:8vh auto}button{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:var(--g);color:var(--n)}.secondary{background:#eef2f7;color:var(--n)}.danger{background:#ffe9e9;color:#a52222}input,select{width:100%;padding:11px;border:1px solid #d4dce5;border-radius:10px;font:inherit}label{display:block;font-size:12px;font-weight:800;color:var(--m);margin:7px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.item{border:1px solid var(--l);border-radius:14px;padding:13px;margin:9px 0}.player{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--l);padding:9px;border-radius:10px;margin:7px 0}.hidden{display:none!important}.msg{padding:10px;background:#eef7ee;color:#256029;border-radius:10px}@media(max-width:700px){main{padding:14px}.grid,.row{grid-template-columns:1fr}.player{align-items:flex-start}} </style></head><body><header><div class="bar"><div class="brand"><img class="logo" src="data:image/svg+xml;charset=UTF-8,%3Csvg xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22 viewBox%3D%220 0 500 500%22%3E%3Ccircle cx%3D%22250%22 cy%3D%22250%22 r%3D%22240%22 fill%3D%22%23e5aa49%22%2F%3E%3Ccircle cx%3D%22250%22 cy%3D%22250%22 r%3D%22180%22 fill%3D%22none%22 stroke%3D%22%23071a33%22 stroke-width%3D%2210%22%2F%3E%3Ctext x%3D%22250%22 y%3D%22305%22 text-anchor%3D%22middle%22 font-family%3D%22Arial%22 font-size%3D%22108%22 font-weight%3D%22900%22 fill%3D%22%23071a33%22%3EMPL%3C%2Ftext%3E%3Cpolygon points%3D%22385%2C245 392%2C260 409%2C262 396%2C273 400%2C290 385%2C281 370%2C290 374%2C273 361%2C262 378%2C260%22 fill%3D%22%23071a33%22%2F%3E%3C%2Fsvg%3E"><div>MASTER PRO LİG<div class="small">Yönetici Paneli</div></div></div><button class="secondary" onclick="location.href='index.html'">← Siteye Dön</button></div></header><main><section id="login" class="card login"><h1>🔐 Yönetici Girişi</h1><p class="muted" style="color:#6d7c8e">Yönetici şifresini girin.</p><label>Şifre</label><input id="pw" type="password" onkeydown="if(event.key==='Enter')login()"><div class="actions"><button class="primary" onclick="login()">Giriş Yap</button></div><b id="err" class="hidden" style="color:#a52222">Şifre hatalı.</b></section><section id="panel" class="hidden"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><h1>Yönetim Paneli</h1><p class="muted" style="color:#6d7c8e">Takım, oyuncu, fikstür ve sonuç yönetimi.</p></div><button class="danger" onclick="logout()">Çıkış</button></div><div id="msg"></div></div><div class="grid"><section class="card"><h2>🏆 Turnuva</h2><label>Turnuva adı</label><input id="leagueName"><div class="actions"><button class="primary" onclick="saveLeague()">Kaydet</button></div></section><section class="card"><h2>⚽ Maç Ekle</h2><div class="row"><div><label>Tarih</label><input id="date" type="date"></div><div><label>Saat</label><input id="time" type="time" value="21:00"></div><div><label>Ev Sahibi</label><select id="home"></select></div></div><div class="row"><div><label>Deplasman</label><select id="away"></select></div><div><label>Ev Skor</label><input id="hs" type="number" min="0"></div><div><label>Dep Skor</label><input id="as" type="number" min="0"></div></div><div class="actions"><button class="primary" onclick="addFixture()">Maçı Ekle</button></div></section></div><section class="card"><h2>🛡️ Takımlar & Kadrolar</h2><div id="teams"></div></section><section class="card"><h2>📅 Maçlar</h2><div id="fixtures"></div></section></section></main><script>const LOGO='data:image/svg+xml;charset=UTF-8,%3Csvg xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22 viewBox%3D%220 0 500 500%22%3E%3Ccircle cx%3D%22250%22 cy%3D%22250%22 r%3D%22240%22 fill%3D%22%23e5aa49%22%2F%3E%3Ccircle cx%3D%22250%22 cy%3D%22250%22 r%3D%22180%22 fill%3D%22none%22 stroke%3D%22%23071a33%22 stroke-width%3D%2210%22%2F%3E%3Ctext x%3D%22250%22 y%3D%22305%22 text-anchor%3D%22middle%22 font-family%3D%22Arial%22 font-size%3D%22108%22 font-weight%3D%22900%22 fill%3D%22%23071a33%22%3EMPL%3C%2Ftext%3E%3Cpolygon points%3D%22385%2C245 392%2C260 409%2C262 396%2C273 400%2C290 385%2C281 370%2C290 374%2C273 361%2C262 378%2C260%22 fill%3D%22%23071a33%22%2F%3E%3C%2Fsvg%3E';const old=JSON.parse(localStorage.getItem('mplData')||'null');const seed={tournaments:[{id:'mpl-2026',name:'Master Pro Lig 2026'}],teams:[{id:'s1453',name:'Sultanbeyli 1453 Masterlar',city:'İstanbul',logo:LOGO,players:[]},{id:'legends',name:'Legends FC',city:'İstanbul',logo:'LF',players:[]},{id:'anadolu',name:'Anadolu Veteran',city:'İstanbul',logo:'AV',players:[]},{id:'pendik',name:'Pendik Güzelyalı',city:'İstanbul',logo:'PG',players:[]},{id:'velibaba',name:'Velibaba Master',city:'İstanbul',logo:'VM',players:[]},{id:'unoser',name:'Unoser Masterlar',city:'İstanbul',logo:'UM',players:[]}],fixtures:[]};let data=old||seed;data.tournaments=data.tournaments||seed.tournaments;data.teams=data.teams||[];data.fixtures=data.fixtures||[];data.teams.forEach(t=>{t.players=t.players||[];if(t.id==='s1453')t.logo=LOGO});const T=id=>data.teams.find(t=>t.id===id),save=()=>localStorage.setItem('mplData',JSON.stringify(data)),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function login(){if(pw.value==='a475rh45'){sessionStorage.setItem('mplAdmin','1');document.getElementById('login').classList.add('hidden');panel.classList.remove('hidden');render()}else err.classList.remove('hidden')}function logout(){sessionStorage.removeItem('mplAdmin');location.reload()}function note(x){msg.className='msg';msg.textContent=x;setTimeout(()=>msg.textContent='',2000)}function saveLeague(){data.tournaments[0].name=leagueName.value.trim()||'Master Pro Lig 2026';save();note('Turnuva adı kaydedildi.')}function addFixture(){if(!date.value)return alert('Tarih seçin.');if(home.value===away.value)return alert('Takımlar farklı olmalı.');data.fixtures.push({id:'f'+Date.now(),t:data.tournaments[0].id,date:date.value,time:time.value||'21:00',home:home.value,away:away.value,hs:hs.value===''?null:Number(hs.value),as:as.value===''?null:Number(as.value)});save();note('Maç eklendi.');hs.value='';as.value='';render()}function delFixture(id){if(confirm('Maç silinsin mi?')){data.fixtures=data.fixtures.filter(f=>f.id!==id);save();render()}}function addPlayer(id){let t=T(id),name=prompt('Oyuncu adı');if(!name)return;let pos=prompt('Mevki','Oyuncu')||'Oyuncu',no=prompt('Forma numarası','');t.players.push({name,pos,no});save();render()}function delPlayer(id,i){if(confirm('Oyuncu silinsin mi?')){T(id).players.splice(i,1);save();render()}}function render(){leagueName.value=data.tournaments[0].name;let o=data.teams.map(t=>'<option value="'+t.id+'">'+esc(t.name)+'</option>').join('');home.innerHTML=o;away.innerHTML=o;teams.innerHTML=data.teams.map(t=>'<div class="item"><div style="display:flex;align-items:center;gap:12px"><img src="'+(String(t.logo).startsWith('data:image')?t.logo:LOGO)+'" style="width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid #e5aa49"><div><b>'+esc(t.name)+'</b><div class="muted" style="color:#6d7c8e">'+esc(t.city||'')+' • '+t.players.length+' oyuncu</div></div></div><div class="actions"><button class="secondary" onclick="addPlayer(\''+t.id+'\')">+ Oyuncu</button></div>'+t.players.map((p,i)=>'<div class="player"><span><b>'+esc(p.no||'—')+'</b> • '+esc(p.name)+' <span class="muted" style="color:#6d7c8e">('+esc(p.pos)+')</span></span><button class="danger" onclick="delPlayer(\''+t.id+'\','+i+')">Sil</button></div>').join('')+'</div>').join('');fixtures.innerHTML=data.fixtures.length?data.fixtures.map(f=>'<div class="item"><b>'+esc(T(f.home)?.name||'-')+' — '+esc(T(f.away)?.name||'-')+'</b><div class="muted" style="color:#6d7c8e">'+f.date+' • '+esc(f.time)+' • '+(f.hs==null?'Oynanmadı':f.hs+' - '+f.as)+'</div><div class="actions"><button class="danger" onclick="delFixture(\''+f.id+'\')">Maçı Sil</button></div></div>').join(''):'<p class="muted" style="color:#6d7c8e">Henüz maç yok.</p>'}if(sessionStorage.getItem('mplAdmin')==='1'){document.getElementById('login').classList.add('hidden');panel.classList.remove('hidden');render()}</script></body></html>
